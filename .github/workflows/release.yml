name: Release

# Push a tag like v0.1.0 to publish that version to PyPI (Trusted Publishing, no token).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag must match package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(PYTHONPATH=src python -c "import tenbis_credit; print(tenbis_credit.__version__)")
          test "$TAG" = "v$VERSION" || { echo "tag $TAG != version v$VERSION"; exit 1; }
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tenbis-credit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
