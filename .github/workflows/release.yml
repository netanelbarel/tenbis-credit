name: Release

# Push a tag like v0.1.0 to publish that version to PyPI (Trusted Publishing, no token).
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Tag must match package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(PYTHONPATH=src python -c "import tenbis_credit; print(tenbis_credit.__version__)")
          test "$TAG" = "v$VERSION" || { echo "tag $TAG != version v$VERSION"; exit 1; }
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tenbis-credit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
